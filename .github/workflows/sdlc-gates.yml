name: sdlc-gates

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (OpenSSF Scorecard: Pinned-Dependencies); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Gates (semantic checks, approvals, architecture, contracts, test-first, weakened tests)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 .harness/sdlc.pyz check --base "origin/$BASE_REF"
          else
            python3 .harness/sdlc.pyz check
          fi
      - name: CODEOWNERS matches roster
        run: python3 .harness/sdlc.pyz codeowners --check
      - name: Approvals confirmed by GitHub (identity, content, role, separation of duties)
        if: github.event_name != 'push'
        env:
          # Needs read:org to resolve team membership; use a fine-grained token if teams are used in the roster.
          GITHUB_TOKEN: ${{ secrets.SDLC_APPROVALS_TOKEN || github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 .harness/sdlc.pyz approvals verify --platform github --base "origin/$BASE_REF"
      - name: Conventional Commits and trailers
        if: github.event_name != 'push'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            python3 .harness/sdlc.pyz commit-msg "$RUNNER_TEMP/msg" || { echo "commit $sha"; exit 1; }
          done

  sensors:
    # Scanners only produce evidence (SARIF / CycloneDX); `sdlc evidence check` applies the policy from
    # harness.toml and .harness/exceptions.toml. Pin images by digest and mirror them for private or air-gapped CI.
    # Imágenes fijadas por digest el 2026-09-17 (threat-model T-15); Dependabot (ecosistema docker) no las actualiza en workflows: revisar en cada iteración.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Secrets (gitleaks)
        run: |
          mkdir -p sdlc-evidence
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --exit-code 0 \
            --report-format sarif --report-path /repo/sdlc-evidence/secrets.sarif
      - name: SAST (Semgrep)
        # p/default downloads rules from the Semgrep registry; for offline CI use --config path/to/rules/.
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            semgrep scan --config p/default --metrics off --sarif --output sdlc-evidence/sast.sarif
      - name: Dependencies (Trivy)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --format sarif --output sdlc-evidence/sca.sarif .
      - name: SBOM (Syft, CycloneDX)
        run: |
          docker run --rm -v "$PWD:/src" -w /src anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 \
            dir:. --exclude ./sdlc-evidence -o cyclonedx-json=sdlc-evidence/sbom.json
      - name: IaC (Checkov)
        if: hashFiles('**/*.tf', '**/Chart.yaml', '**/*.bicep', '**/cloudformation/**', '**/k8s/**') != ''
        run: |
          docker run --rm -v "$PWD:/src" -w /src bridgecrew/checkov:3.3.19@sha256:d3e96adafdb315ca82e792ca8708c01adae85292800fb064c8b309b3d0cb7b80 -d . --quiet --soft-fail \
            -o sarif --output-file-path sdlc-evidence
          mv sdlc-evidence/results_sarif.sarif sdlc-evidence/iac.sarif
      - name: Evidence policy
        run: python3 .harness/sdlc.pyz evidence check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sdlc-evidence
          path: sdlc-evidence/

  dependencies:
    # The action needs the dependency graph, which private repositories only have with GitHub Advanced Security;
    # without it every run fails with "Dependency review is not supported on this repository". Trivy (above) still
    # scans dependencies in that case.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

# El job `workflows` que trae la plantilla 0.7.0 no se instala aquí: ci.yml ya corre actionlint y zizmor
# (threat-model T-16) con ambas herramientas fijadas por digest y zizmor sin red. Dos jobs con el mismo
# nombre dejaban el check requerido `workflows` duplicado en cada PR.
