# SDLC harness configuration. Docs: https://github.com/<owner>/sdlc-harness
[harness]
version = "0.7.0"
# lite | standard | regulated  (see .harness/profiles/)
profile = "standard"
agents_md_max_lines = 150

[agents]
# Adapters to generate from AGENTS.md + .agents/skills (catalog: .harness/adapters.toml)
targets = ["claude-code", "codex", "gemini-cli", "cursor", "copilot"]
# symlink (default) | copy (Windows without developer mode)
mode = "symlink"

[organization]
# Mandatory organization policy, skills and memory: a git URL or local path. Vendored by `sdlc org pull`.
source = ""
ref = "main"

[paths]
skills = ".agents/skills"
changes = "docs/changes"
adr = "docs/adr"
templates = "docs/sdlc/templates"

[verification]
# Globs of test sources. When set, test names cited in verification.md (in `backticks`) must exist there.
test_paths = ["src/**/*.test.ts", "tests/**/*.test.ts", "tests/**/*.spec.ts"]

[tdd]
# Globs (fnmatch). Empty test_globs uses common conventions for Python, JS/TS, Go, JVM, .NET and Ruby.
# Empty source_globs treats any file with a code extension outside docs/ and harness folders as source.
test_globs = ["src/**/*.test.ts", "tests/**/*.test.ts", "tests/**/*.spec.ts", "tests/lint/fixtures/*"]
# El cliente Prisma (src/generated) se genera; no es código fuente escrito a mano.
source_globs = ["src/*.ts", "src/**/*.ts", "src/**/*.tsx", "scripts/*.mjs", "prisma/*.prisma", "prisma/**/*.sql", "Dockerfile", "docker-compose.yml", "*.config.ts", "*.config.mjs"]

[contracts]
# OpenAPI 3.x / AsyncAPI 2.x-3.x documents (YAML or JSON). Breaking changes require a major info.version bump.
files = []

[evidence]
# Scanners write SARIF (<kind>*.sarif) and CycloneDX JSON (sbom*.json) here; see the sdlc-gates workflow.
dir = "sdlc-evidence"
# Minimum severity that fails the gate: low | medium | high | critical
fail_on = "high"
# SPDX identifiers denied in dependencies (checked in SBOM license data).
license_deny = ["AGPL-1.0-only", "AGPL-1.0-or-later", "AGPL-3.0-only", "AGPL-3.0-or-later", "SSPL-1.0", "BUSL-1.1"]

# Added by sdlc upgrade 0.7.0

[release]
# `.github/workflows/sdlc-release.yml` runs `scripts/build-release` (executable, no arguments) and expects it to
# leave every published artifact in dist/. Everything after that - SBOM, provenance, signatures, the GitHub
# release - operates on dist/.
# sbom_source is what Syft scans. `dir:dist` inventories files; use the form that matches the real artifact, or
# the SBOM will describe the directory instead of what you ship:
#   docker-archive:dist/app.tar   OCI image saved with `docker save`
#   oci-archive:dist/app.oci      OCI layout tarball
#   file:dist/app.jar             a single binary, jar or wheel
# scripts/build-release exporta las dos imágenes OCI con la versión en el nombre; el workflow
# sustituye VERSION por la del tag.
sbom_source = "docker-archive:dist/booking-VERSION-runner.oci.tar"
